name: '[CI] Auto PR Open'
run-name: "Auto PR · ${{ github.ref_name }}"

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'

jobs:
  open-pr:
    name: Open PR to main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Repo: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

          PR_COUNT=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq 'length')

          echo "Open PRs $GITHUB_REF_NAME -> main: $PR_COUNT"

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "PR already exists. Skipping."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "Merge $GITHUB_REF_NAME into main" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body "Auto-generated by GitHub Actions."
