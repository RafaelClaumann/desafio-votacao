name: '[CI] Build Application'
run-name: "Build ${{ github.ref_name }} · ${{ github.event.head_commit.message }}"
on:
  push:
    branches: [ 'feature/**', 'feat/**' ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
          cache: 'maven'

      - name: Print System Settings
        run: |
          printf "$(java -version)\n"
          printf "$(mvn -version)\n"

      - name: Build Application
        run: |
          printf "building application artifact!\n"
          printf "current_dir: $PWD\n"
          ls -ll
          
          mvn clean install \
          --threads 2C \
          --file pom.xml

      - name: Check JaCoCo Coverage
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          minimum_coverage: ${{ vars.COVERAGE_THRESHOLD || '80' }}
          fail-if-coverage-less-than: true
