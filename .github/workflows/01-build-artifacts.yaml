name: '[CI] Build Application'
run-name: "Build · ${{ github.ref_name }}"
on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
          cache: 'maven'

      - name: Print System Settings
        run: |
          printf "$(java -version)\n"
          printf "$(mvn -version)\n"

      - name: Build Application
        run: |
          printf "building application artifact!\n"
          printf "current_dir: $PWD\n"
          ls -ll
          
          ./mvnw -B clean install --threads 2C

      - name: Check JaCoCo Coverage
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          fail-if-coverage-less-than: ${{ vars.COVERAGE_THRESHOLD || '80' }}

      - name: Publish Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 1
