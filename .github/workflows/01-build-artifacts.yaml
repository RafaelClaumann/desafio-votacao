name: Build Feature Artifacts
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
          cache: 'maven'

      - name: Print system settings
        run: |
          printf "$(java -version)\n"
          printf "$(mvn -version)\n"

      - name: Build application
        run: |
          printf "building application artifact!\n"
          printf "current_dir: $PWD\n"
          ls -ll
          
          mvn clean install \
          --threads 2C \
          --file pom.xml

      - name: Check coverage
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          minimum_coverage: ${{ vars.COVERAGE_THRESHOLD || '80' }}
          fail-if-coverage-less-than: true
